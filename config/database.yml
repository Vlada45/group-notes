default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: group-notes-development
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  database: group-notes-test
  url: <%= ENV["DATABASE_URL"] %>

production:
  <<: *default
  database: group-notes-production
  url: <%= ENV["DATABASE_URL"] %>
